name: CI/CD Pipeline

on:
  # Run on pull requests targeting dev (feature development) or main (release candidates)
  pull_request:
    branches: [dev, main]
  
  # Run on pushes to dev (integration testing) or main (production releases)
  push:
    branches: [dev, main]
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  # Unit and API tests (no Docker, mocked external dependencies)
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'gateway-service/go.sum'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ml-service/requirements.txt
            tests/api/requirements.txt
            .github/scripts/requirements.txt
      
      - name: Install system dependencies for ML service
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          # Install dlib from system packages if available (much faster)
          sudo apt-get install -y libdlib-dev || true
      
      - name: Install runner dependencies
        run: pip install -r .github/scripts/requirements.txt
      
      - name: Run Service Tests
        run: make service-tests
        env:
          CI: true
      
      - name: Run API Contract Tests (Mocked)
        run: make test-api
        env:
          CI: true
          # Use mock/test URLs instead of real services
          GATEWAY_BASE_URL: http://localhost:8080
          ML_BASE_URL: http://localhost:8000
      
      - name: Upload detailed logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-logs-${{ github.run_number }}
          path: |
            logs/
            .service-test-logs/
            .test-logs/
            .lint-logs/
            .build-logs/
          retention-days: 30
          if-no-files-found: ignore
  
  # Integration tests (only run on main branch for production readiness)
  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'gateway-service/go.sum'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ml-service/requirements.txt
            tests/api/requirements.txt
            .github/scripts/requirements.txt
      
      - name: Install script dependencies
        run: pip install -r .github/scripts/requirements.txt
      
      - name: Run integration tests with Docker services
        run: make test-integration-ci
        env:
          CI: true
      
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-logs
          path: logs/
          retention-days: 7
